<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch and Earn</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- OFFICIAL SUPABASE AUTH LOGIN CONTAINER -->
        <div id="auth-container">
            <h2>Sign In / Register</h2>
            <div id="supabase-auth-ui"></div>
        </div>

        <!-- MAIN WATCH AND EARN INTERFACE (Hidden until logged in) -->
        <div id="main-panel" style="display: none;">
            <h1>Watch and Earn Engine</h1>
            <p id="welcome-user" style="color: #03dac6; font-weight: bold; margin-bottom: 20px;">Welcome!</p>
            
            <div class="timer-box">
                <p>Next Reward Payout In:</p>
                <div id="countdown">03:00:00</div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Your Coins</h3>
                    <p id="user-coins">0</p>
                </div>
                <div class="stat-card">
                    <h3>Estimated Cash</h3>
                    <p id="est-cash">Calculating...</p>
                </div>
            </div>

            <div class="ad-section">
                <button id="watch-ad-btn" onclick="simulateAdWatch()">Watch Ad (+5,000 Coins)</button>
            </div>
            <button onclick="handleLogout()" style="background-color: #ff3333; margin-top: 20px; padding: 10px; color: white;">Logout</button>
        </div>
    </div>

    <!-- Official UI Widgets Loader CDN Scripts -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="script.js"></script>
</body>
</html>
